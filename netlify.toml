[build]
  command = "npm run build"
  publish = "out"
  # 开发阶段由 GitHub Pages 托管；退出码 0 会跳过 Netlify 的 Git 自动构建。
  ignore = "exit 0"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
