name: App Icon Preview

on:
  push:
    branches: [main]
    paths:
      - "DesignAssets/AppIcon/*.svg"
      - "ios/ShiftLedger/Resources/AppIcon.icon/**"
      - "ios/project.yml"
      - ".github/workflows/icon-preview.yml"
  workflow_dispatch:

concurrency:
  group: shift-ledger-app-icon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Check for finalized icon bundle
        id: icon
        run: |
          if [ -f ios/ShiftLedger/Resources/AppIcon.icon/icon.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Icon exploration is active; no final AppIcon.icon bundle yet."
          fi

      - name: Select Xcode
        if: steps.icon.outputs.ready == 'true'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check Icon Composer
        if: steps.icon.outputs.ready == 'true'
        run: npx -y -p icon-composer-mcp@1.1.0 icon-composer doctor

      - name: Validate icon bundle
        if: steps.icon.outputs.ready == 'true'
        run: npx -y -p icon-composer-mcp@1.1.0 icon-composer inspect ios/ShiftLedger/Resources/AppIcon.icon

      - name: Render Apple Liquid Glass appearances
        if: steps.icon.outputs.ready == 'true'
        run: |
          mkdir -p build/app-icon
          for rendition in Default Dark TintedLight TintedDark ClearLight ClearDark; do
            npx -y -p icon-composer-mcp@1.1.0 icon-composer render \
              ios/ShiftLedger/Resources/AppIcon.icon \
              "build/app-icon/${rendition}.png" \
              --platform iOS \
              --rendition "$rendition" \
              --width 1024 \
              --height 1024
          done

      - name: Export marketing icon
        if: steps.icon.outputs.ready == 'true'
        run: |
          npx -y -p icon-composer-mcp@1.1.0 icon-composer export-marketing \
            ios/ShiftLedger/Resources/AppIcon.icon \
            build/app-icon/Marketing-1024.png \
            --size 1024

      - name: Include source bundle
        if: steps.icon.outputs.ready == 'true'
        run: cp -R ios/ShiftLedger/Resources/AppIcon.icon build/app-icon/AppIcon.icon

      - name: Upload icon package
        if: steps.icon.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: shift-ledger-app-icon-${{ github.sha }}
          path: build/app-icon
          if-no-files-found: error
